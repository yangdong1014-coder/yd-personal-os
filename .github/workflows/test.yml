name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-system-v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run platform-independent pytest
        run: pytest -m "not production_ownership"
        env:
          YD_OS_DB_PATH: /tmp/yd_os_test.db

      - name: Run production ownership contract tests
        run: |
          python_bin="$(command -v python)"
          sudo env YD_OS_DB_PATH=/tmp/yd_os_test-privileged.db "$python_bin" -m pytest -m production_ownership
