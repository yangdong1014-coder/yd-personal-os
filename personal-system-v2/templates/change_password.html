{% extends "base.html" %}

{% block title %}修改密码 · 个人能力操作系统{% endblock %}

{% block content %}
<header class="page-header">
  <h1 class="page-title">修改密码</h1>
  <p class="page-subtitle">
    {% if current_user.must_change_password %}
    当前密码为临时密码。完成修改后才能进入业务页面。
    {% else %}
    修改后，其他浏览器中的旧登录状态会立即失效。
    {% endif %}
  </p>
</header>

<section class="section-card account-form-card">
  {% if error %}
  <div class="auth-alert" role="alert">{{ error }}</div>
  {% endif %}
  <form method="post" class="auth-form account-password-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="auth-field">
      <span class="form-label">当前密码</span>
      <input class="input" type="password" name="current_password" autocomplete="current-password" maxlength="256" required autofocus>
    </label>
    <label class="auth-field">
      <span class="form-label">新密码</span>
      <input class="input" type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="256" required>
      <span class="form-hint">至少 12 个字符，不得与当前密码相同。</span>
    </label>
    <label class="auth-field">
      <span class="form-label">确认新密码</span>
      <input class="input" type="password" name="confirm_password" autocomplete="new-password" minlength="12" maxlength="256" required>
    </label>
    <div class="form-actions-row">
      <button type="submit" class="btn">保存新密码</button>
    </div>
  </form>
</section>
{% endblock %}
