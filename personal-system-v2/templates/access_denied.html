<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ error_title or '无权访问' }} · 个人能力操作系统</title>
  <script>
    (function () {
      var saved = localStorage.getItem("personal-os-ui-theme");
      var allowed = ["theme-dark-warm", "theme-dark-cool", "theme-light-warm", "theme-light-cool"];
      document.documentElement.classList.add(allowed.indexOf(saved) >= 0 ? saved : "theme-dark-warm");
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="section-card auth-card" role="alert">
      <p class="auth-eyebrow">PSY · ACCESS CONTROL</p>
      <h1 class="auth-title">{{ error_title or '无权访问' }}</h1>
      <p class="auth-subtitle">{{ error_message or '当前账户没有执行此操作的权限。' }}</p>
      {% if current_user.is_authenticated and current_user.is_admin %}
        <a class="btn auth-submit" href="{{ url_for('index') }}">返回系统</a>
      {% elif current_user.is_authenticated %}
        <a class="btn auth-submit" href="{{ url_for('change_password') }}">返回账户设置</a>
      {% else %}
        <a class="btn auth-submit" href="{{ url_for('login') }}">返回登录</a>
      {% endif %}
    </section>
  </main>
</body>
</html>
